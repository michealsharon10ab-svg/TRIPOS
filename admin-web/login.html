<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriPOS — Login</title>
  <meta name="description" content="TriPOS — Unified POS login for shops, restaurants and hotels." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="login-root">
  <!-- ══════════════════════════════════════════════════════════════════
       LEFT BRAND PANEL
       ══════════════════════════════════════════════════════════════════ -->
  <div class="brand-panel">
    <!-- Brand mark -->
    <div class="brand-mark">
      <div class="brand-grid">
        <div class="cell accent"></div>
        <div class="cell dim"></div>
        <div class="cell dim"></div>
        <div class="cell accent"></div>
      </div>
      <span class="brand-name">TriPOS</span>
    </div>

    <div class="brand-spacer"></div>

    <!-- Icon cluster -->
    <div class="icon-cluster">
      <!-- Top center: Shop -->
      <div class="icon-row">
        <div class="icon-tile" title="Shop / Retail">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
      </div>
      <!-- Bottom row: Restaurant + Hotel -->
      <div class="icon-row">
        <div class="icon-tile" title="Restaurant">
          <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        </div>
        <div class="icon-tile" title="Hotel">
          <svg viewBox="0 0 24 24"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        </div>
      </div>
    </div>

    <!-- Promo copy -->
    <div class="promo-copy">
      <h2 class="promo-headline">One POS for shops, restaurants and hotels</h2>
      <p class="promo-body">
        Billing, kitchen orders, room folios and stock — across every branch, even when the internet drops.
      </p>
      <div class="pill-row">
        <span class="pill-tag">Retail</span>
        <span class="pill-tag">Restaurant</span>
        <span class="pill-tag">Hotel</span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
       RIGHT LOGIN PANEL
       ══════════════════════════════════════════════════════════════════ -->
  <div class="login-panel">
    <form class="login-form-card" id="loginForm" autocomplete="off" novalidate>
      <h1 class="login-heading">Welcome back</h1>
      <p class="login-subheading">Sign in to Lanka Leisure Group</p>

      <!-- Error -->
      <div class="login-error" id="loginError"></div>

      <!-- Username -->
      <div class="field-group">
        <label class="field-label" for="username">Username or email</label>
        <input type="text" id="username" class="login-field" placeholder="Enter username or email" autocomplete="username" />
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="login-field" placeholder="Enter password" autocomplete="current-password" />
          <button type="button" class="password-toggle" id="pwToggle" aria-label="Show password">👁</button>
        </div>
      </div>

      <!-- Options -->
      <div class="options-row">
        <label class="remember-check">
          <input type="checkbox" id="rememberTerminal" />
          Remember this terminal
        </label>
        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <!-- Sign In -->
      <button type="submit" class="btn-signin" id="signInBtn">
        <div class="spinner"></div>
        <span>Sign in</span>
      </button>

      <!-- Divider -->
      <div class="divider-row">
        <hr /><span>or</span><hr />
      </div>

      <!-- PIN Login -->
      <button type="button" class="btn-pin" id="pinLoginBtn">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Use PIN login</span>
      </button>

      <!-- Footer -->
      <div class="footer-meta">
        Colombo City Hotel &nbsp;·&nbsp; Terminal 2 &nbsp;·&nbsp; TriPOS v1.0
      </div>
    </form>
  </div>
</div>

<script>
// ── Login Controller ──────────────────────────────────────────────────
const form       = document.getElementById('loginForm');
const errorEl    = document.getElementById('loginError');
const username   = document.getElementById('username');
const password   = document.getElementById('password');
const signInBtn  = document.getElementById('signInBtn');
const pwToggle   = document.getElementById('pwToggle');
const forgotLink = document.getElementById('forgotLink');
const pinBtn     = document.getElementById('pinLoginBtn');

// Password toggle
pwToggle.addEventListener('click', () => {
  const t = password.type === 'password' ? 'text' : 'password';
  password.type = t;
  pwToggle.textContent = t === 'password' ? '👁' : '🙈';
});

// Clear errors on input
[username, password].forEach(el =>
  el.addEventListener('input', () => hideError())
);

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('show');
}
function hideError() {
  errorEl.classList.remove('show');
  username.classList.remove('error');
  password.classList.remove('error');
}

function setLoading(on) {
  signInBtn.disabled = on;
  signInBtn.classList.toggle('loading', on);
  signInBtn.querySelector('span').textContent = on ? 'Signing in…' : 'Sign in';
  username.disabled = on;
  password.disabled = on;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  hideError();

  const u = username.value.trim();
  const p = password.value;

  if (!u) { showError('Please enter your username or email.'); username.focus(); username.classList.add('error'); return; }
  if (!p) { showError('Please enter your password.'); password.focus(); password.classList.add('error'); return; }
  if (u.includes('@') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) {
    showError("That email address doesn't look valid. Please check and try again.");
    username.focus(); username.classList.add('error'); return;
  }

  setLoading(true);

  // PROTOTYPE: simulate auth call — replace with real API
  setTimeout(() => {
    setLoading(false);
    window.location.href = 'checkout.html';
  }, 1500);
});

forgotLink.addEventListener('click', e => {
  e.preventDefault();
  alert('Forgot Password — Not Yet Implemented\n\nConnect this link to the backend password-recovery workflow.');
});

pinBtn.addEventListener('click', () => {
  alert('PIN Authentication — Not Yet Implemented\n\nConnect this button to the secure PIN authentication workflow.');
});
</script>

</body>
</html>
